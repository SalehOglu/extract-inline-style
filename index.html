<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="/src/imgs/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/src/css/style.css">
    <title>Extract inline style from HTML</title>
</head>
<body>

    <div class="wrapper">
        <div class="inner">
            <h1>Upload Your HTML Files</h1>
            <img src="/src/imgs/upload.png" alt="Icon"/>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="fileupload">
                    <input type="file" id="fileInput" class="file-input" accept=".html" multiple required/>
                    <label for="fileInput" class="fileLabel">Browse</label>
                </div>
                <div class="selected" id="selectedFiles">
                    <span>No files chosen</span>
                </div>
                <button id="submitBtn" type="submit">Convert</button>
            </form>
            <div id="message"></div>
            <div id="downloadLinkContainer" style="display: none;">
                <h3>Converted Files</h3>
                <div class="file-list" id="fileList"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const selectedFilesDiv = document.getElementById('selectedFiles');
            const convertButton = document.getElementById('submitBtn');
            const msg = document.getElementById('message');
            const downloadContainer = document.getElementById('downloadLinkContainer');
            const fileList = document.getElementById('fileList');

            document.getElementById('uploadForm').addEventListener('submit', function(event) {
                event.preventDefault();

                convertButton.textContent = 'Converting..';
                convertButton.classList.add("loading");
                msg.className = '';
                msg.textContent = '';
                downloadContainer.style.display = 'none';
                fileList.innerHTML = '';

                const formData = new FormData();
                for (let i = 0; i < fileInput.files.length; i++) {
                    formData.append('files[]', fileInput.files[i]);
                }

                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errData => {
                            throw new Error(errData.message || 'Server error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    msg.textContent = data.message;
                    msg.className = 'active';

                    if (data.files && data.files.length > 0) {
                        data.files.forEach(file => {
                            const item = document.createElement('div');
                            item.className = 'file-item';

                            const name = document.createElement('span');
                            name.className = 'file-item-name';
                            name.textContent = file.name;
                            name.title = file.name;

                            const actions = document.createElement('div');
                            actions.className = 'file-actions';

                            const downloadLink = document.createElement('a');
                            downloadLink.href = file.url;
                            downloadLink.download = file.name;
                            downloadLink.className = 'btn-action btn-download';
                            downloadLink.textContent = 'Download';

                            const previewLink = document.createElement('a');
                            previewLink.href = file.url;
                            previewLink.target = '_blank';
                            previewLink.className = 'btn-action btn-preview';
                            previewLink.textContent = 'Preview';

                            actions.appendChild(downloadLink);
                            actions.appendChild(previewLink);

                            item.appendChild(name);
                            item.appendChild(actions);
                            fileList.appendChild(item);
                        });

                        downloadContainer.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    msg.textContent = 'Error: ' + error.message;
                    msg.className = 'active error';
                })
                .finally(() => {
                    convertButton.textContent = 'Convert';
                    convertButton.classList.remove("loading");
                });
            });

            // Update the div to show the selected file names
            fileInput.addEventListener('change', function(event) {
                const fileNames = Array.from(event.target.files).map(file => file.name).join(', ');
                selectedFilesDiv.textContent = fileNames || 'No files chosen';

                if (fileInput.files.length > 0) {
                    convertButton.style.display = 'block';
                } else {
                    convertButton.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
